<svg xmlns="http://www.w3.org/2000/svg" width="400" height="450" viewBox="0 0 400 450">

  <defs>
    <clipPath id="arch-clip">
      <path d="M 26,425 L 26,200 A 174,174,0,0,1,374,200 L 374,425 Z"/>
    </clipPath>
  </defs>

  <rect width="400" height="450" fill="#FFFFFF"/>

  <g clip-path="url(#arch-clip)">

    <!-- LEFT STRAP -->
    <rect x="34" y="234" width="61" height="14" rx="5" fill="#000000"/>

    <!-- RIGHT STRAP -->
    <rect x="305" y="234" width="61" height="14" rx="5" fill="#000000"/>

    <!-- LEFT LENS — outer ring (black ring, white interior) -->
    <circle cx="143" cy="241" r="50" fill="#000000"/>
    <circle cx="143" cy="241" r="41" fill="#FFFFFF"/>

    <!-- RIGHT LENS — outer ring -->
    <circle cx="257" cy="241" r="50" fill="#000000"/>
    <circle cx="257" cy="241" r="41" fill="#FFFFFF"/>

    <!-- NOSE BRIDGE connecting the two lenses -->
    <rect x="189" y="233" width="22" height="16" rx="3" fill="#000000"/>

    <!-- Inner lens edge ring (gives the goggle-glass look) -->
    <circle cx="143" cy="241" r="35" fill="none" stroke="#000000" stroke-width="1.5"/>
    <circle cx="257" cy="241" r="35" fill="none" stroke="#000000" stroke-width="1.5"/>

    <!-- ORANGE STARBURST SPARK — visible through right lens, gleeful rigour -->
    <!-- 8-pointed star at (257, 241), outer r=16, inner r=6 -->
    <polygon
      points="257,225 259.1,234.8 268.3,230.7 263.2,239.3 274,241 263.2,242.7 268.3,251.3 259.1,247.2 257,257 254.9,247.2 245.7,251.3 250.8,242.7 240,241 250.8,239.3 245.7,230.7 254.9,234.8"
      fill="#F15A22"/>

  </g>

  <path d="M 20,430 L 20,200 A 180,180,0,0,1,380,200 L 380,430 Z"
        fill="none" stroke="#000000" stroke-width="3"/>
  <path d="M 26,425 L 26,200 A 174,174,0,0,1,374,200 L 374,425 Z"
        fill="none" stroke="#000000" stroke-width="1.5"/>

</svg>
