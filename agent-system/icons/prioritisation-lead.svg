<svg xmlns="http://www.w3.org/2000/svg" width="400" height="450" viewBox="0 0 400 450">
  <defs>
    <clipPath id="arch-clip">
      <path d="M 26,425 L 26,200 A 174,174,0,0,1,374,200 L 374,425 Z"/>
    </clipPath>
  </defs>
  <rect width="400" height="450" fill="#FFFFFF"/>
  <g clip-path="url(#arch-clip)">

    <!-- HOOK — small J-hook the tag hangs from -->
    <path d="M 200,192 L 200,174 C 200,158 218,158 218,172 C 218,180 212,183 208,183"
          fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>

    <!-- TRIAGE TAG — diamond form, slightly angled, entirely orange -->
    <g transform="rotate(-6, 200, 278)">
      <polygon points="200,198 274,272 200,346 126,272" fill="#F15A22"/>

      <!-- Punch hole at top -->
      <circle cx="200" cy="210" r="9" fill="#000000"/>

      <!-- Bold numeral 1 — serif style, centred on tag -->
      <!-- Serif tail (top-left stroke) -->
      <line x1="183" y1="236" x2="196" y2="228"
            stroke="#000000" stroke-width="5" stroke-linecap="round"/>
      <!-- Main vertical stroke -->
      <rect x="193" y="226" width="14" height="92" rx="2" fill="#000000"/>
      <!-- Base serifs -->
      <rect x="178" y="316" width="44" height="12" rx="2" fill="#000000"/>
    </g>

  </g>
  <path d="M 20,430 L 20,200 A 180,180,0,0,1,380,200 L 380,430 Z"
        fill="none" stroke="#000000" stroke-width="3"/>
  <path d="M 26,425 L 26,200 A 174,174,0,0,1,374,200 L 374,425 Z"
        fill="none" stroke="#000000" stroke-width="1.5"/>
</svg>
