<svg xmlns="http://www.w3.org/2000/svg" width="400" height="450" viewBox="0 0 400 450">

  <defs>
    <clipPath id="arch-clip">
      <path d="M 26,425 L 26,200 A 174,174,0,0,1,374,200 L 374,425 Z"/>
    </clipPath>
  </defs>

  <rect width="400" height="450" fill="#FFFFFF"/>

  <g clip-path="url(#arch-clip)">

    <!-- SPECIMEN CARD outer border -->
    <rect x="90" y="112" width="220" height="302" rx="2"
          fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>

    <!-- SPECIMEN CARD inner mount line -->
    <rect x="104" y="125" width="192" height="276" rx="1"
          fill="none" stroke="#000000" stroke-width="1"/>

    <!-- ROOTS — from trunk base (200, 332) spreading down -->
    <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
      <line x1="200" y1="332" x2="200" y2="374" stroke-width="2"/>
      <line x1="200" y1="332" x2="170" y2="368" stroke-width="2"/>
      <line x1="200" y1="332" x2="155" y2="382" stroke-width="1.5"/>
      <line x1="200" y1="332" x2="230" y2="368" stroke-width="2"/>
      <line x1="200" y1="332" x2="245" y2="382" stroke-width="1.5"/>
      <!-- fine root hairs -->
      <line x1="170" y1="368" x2="158" y2="380" stroke-width="1"/>
      <line x1="230" y1="368" x2="242" y2="380" stroke-width="1"/>
    </g>

    <!-- TRUNK -->
    <line x1="200" y1="260" x2="200" y2="332"
          stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>

    <!-- LEVEL 1 BRANCHES from trunk top (200, 260) -->
    <line x1="200" y1="260" x2="163" y2="218"
          stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="200" y1="260" x2="237" y2="218"
          stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>

    <!-- LEVEL 2 BRANCHES — left arm from (163, 218) -->
    <line x1="163" y1="218" x2="142" y2="184"
          stroke="#000000" stroke-width="2" stroke-linecap="round"/>
    <line x1="163" y1="218" x2="184" y2="184"
          stroke="#000000" stroke-width="2" stroke-linecap="round"/>

    <!-- LEVEL 2 BRANCHES — right arm from (237, 218) -->
    <line x1="237" y1="218" x2="216" y2="184"
          stroke="#000000" stroke-width="2" stroke-linecap="round"/>
    <line x1="237" y1="218" x2="258" y2="184"
          stroke="#000000" stroke-width="2" stroke-linecap="round"/>

    <!-- LEVEL 3 TIPS — small end branches -->
    <line x1="142" y1="184" x2="133" y2="162"
          stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="142" y1="184" x2="152" y2="162"
          stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="184" y1="184" x2="176" y2="162"
          stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="184" y1="184" x2="194" y2="162"
          stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="216" y1="184" x2="206" y2="162"
          stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="216" y1="184" x2="224" y2="162"
          stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="258" y1="184" x2="248" y2="162"
          stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="258" y1="184" x2="267" y2="162"
          stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>

    <!-- TOPMOST NEW GROWTH — single branch + orange bud (the opportunity still forming) -->
    <line x1="133" y1="162" x2="128" y2="144"
          stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="128" cy="140" r="7" fill="#F15A22"/>

    <!-- Specimen label line at base of card -->
    <line x1="130" y1="370" x2="270" y2="370"
          stroke="#000000" stroke-width="1"/>

  </g>

  <path d="M 20,430 L 20,200 A 180,180,0,0,1,380,200 L 380,430 Z"
        fill="none" stroke="#000000" stroke-width="3"/>
  <path d="M 26,425 L 26,200 A 174,174,0,0,1,374,200 L 374,425 Z"
        fill="none" stroke="#000000" stroke-width="1.5"/>

</svg>
