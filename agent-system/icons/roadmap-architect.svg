<svg xmlns="http://www.w3.org/2000/svg" width="400" height="450" viewBox="0 0 400 450">
  <defs>
    <clipPath id="arch-clip">
      <path d="M 26,425 L 26,200 A 174,174,0,0,1,374,200 L 374,425 Z"/>
    </clipPath>
  </defs>
  <rect width="400" height="450" fill="#FFFFFF"/>
  <g clip-path="url(#arch-clip)">

    <!-- SIGNAL POST — tall vertical, bold -->
    <rect x="187" y="148" width="8" height="224" fill="#000000"/>
    <!-- Post base plate -->
    <rect x="172" y="366" width="38" height="12" rx="2" fill="#000000"/>

    <!-- SIGNAL ARM — OPEN/CLEAR position (horizontal, pointing right) -->
    <rect x="191" y="171" width="80" height="12" rx="2" fill="#000000"/>
    <!-- Counterweight on opposite side -->
    <rect x="163" y="173" width="26" height="8" rx="2" fill="#000000"/>
    <rect x="151" y="170" width="14" height="14" rx="2" fill="#000000"/>

    <!-- OPEN SIGNAL LAMP — orange: the green light given to the right sequence -->
    <circle cx="278" cy="177" r="14" fill="#F15A22"/>
    <circle cx="278" cy="177" r="8"  fill="#000000" fill-opacity="0.15"/>

    <!-- CLOSED SIGNAL ARM — second position, arm drooped at 45° (stop/blocked) -->
    <line x1="191" y1="177" x2="226" y2="218"
          stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <!-- Closed lamp (dark) -->
    <circle cx="229" cy="222" r="9" fill="#000000"/>

    <!-- LEVER MECHANISM — mid-post, showing mechanical control -->
    <rect x="168" y="310" width="46" height="32" rx="3" fill="#000000"/>
    <line x1="191" y1="310" x2="248" y2="268"
          stroke="#000000" stroke-width="9" stroke-linecap="round"/>
    <circle cx="250" cy="265" r="11" fill="#000000"/>

    <!-- RAILWAY TRACKS AT BASE — two parallel rails -->
    <line x1="66" y1="382" x2="324" y2="382" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <line x1="66" y1="395" x2="324" y2="395" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <!-- Sleepers / cross-ties -->
    <g stroke="#000000" stroke-width="3" stroke-linecap="round">
      <line x1="92"  y1="378" x2="92"  y2="399"/>
      <line x1="130" y1="378" x2="130" y2="399"/>
      <line x1="168" y1="378" x2="168" y2="399"/>
      <line x1="222" y1="378" x2="222" y2="399"/>
      <line x1="260" y1="378" x2="260" y2="399"/>
      <line x1="298" y1="378" x2="298" y2="399"/>
    </g>

  </g>
  <path d="M 20,430 L 20,200 A 180,180,0,0,1,380,200 L 380,430 Z"
        fill="none" stroke="#000000" stroke-width="3"/>
  <path d="M 26,425 L 26,200 A 174,174,0,0,1,374,200 L 374,425 Z"
        fill="none" stroke="#000000" stroke-width="1.5"/>
</svg>
